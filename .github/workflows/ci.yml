name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""   # CI never calls OpenAI; tests use stub crews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Milestone gates
        # A third machine (ubuntu x86-64) runs the offline gates on every push: it is the only way we find
        # out that an artifact only reproduces on the machine that built it (D-M4-3, D-M4-4). Checks that
        # need the deployment skip themselves here, because LIVE_URL is unset.
        run: |
          for m in 1 2 3 4 6; do python scripts/gate.py --m $m; done
