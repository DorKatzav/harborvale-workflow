profile_and_clean:
  description: >
    Step 1: call the profile_raw_data tool on the raw workbook at {raw_path} and read its JSON.
    Step 2: call the clean_dataset tool with raw_path={raw_path} and out_dir={out_dir}.
    Do not compute anything yourself and do not open the file any other way: every number you report
    must appear in a tool's JSON. Then write a cleaning narrative of 3 to 5 sentences for a manager:
    how many rows came in and went out, which spellings were unified and how many rows each touched,
    how many duplicate records were removed and why that matters, and which columns still have missing
    values (kept on purpose, declared for the next crew).
  expected_output: >
    The cleaning narrative (3-5 sentences, every number taken from the tool JSON), followed by a line
    "CLEAN_CSV: <path>" with the clean_csv path returned by clean_dataset, followed by the clean_dataset
    tool's JSON "report" object verbatim.
  agent: data_quality_engineer

explore:
  description: >
    Call the run_eda tool with clean_csv={out_dir}/clean_data.csv and out_dir={out_dir}. Read the "stats"
    object it returns. Then list 6 to 8 findings about who churns and why. Each finding must cite the exact
    figure from the stats (rates as percentages with one decimal, counts as integers, correlations with two
    decimals) and name the group it applies to. Cover at least: the overall churn rate, tenure buckets,
    the complaint effect, the strongest categorical differences, and the top correlates. Do not invent
    numbers and do not compute new ones from the ones you were given.
  expected_output: >
    A bullet list of 6-8 findings, each with a figure copied from the run_eda stats, followed by one line
    naming the two or three strongest drivers of churn.
  agent: business_analyst

write_insights:
  description: >
    Write the business-facing insights document by calling the write_insights tool with out_dir={out_dir}
    and sections_json = a JSON object with exactly these five keys, each a non-empty Markdown string:
    "Overview" (what the dataset is and the headline churn rate, 2-3 sentences),
    "Cleaning" (what the Data Quality Engineer changed, from the previous task's narrative),
    "Who churns" (the groups with the highest and lowest churn, with their rates),
    "Drivers" (the strongest correlates and what they suggest, correlation is not causation),
    "Recommendations" (3 concrete actions for the retention team, each tied to a finding).
    Use only numbers that appeared in the tool outputs of the previous tasks. The key-numbers table is
    generated by the tool; do not write your own table. If the tool answers with "ERROR: ...", fix the
    sections and call it again.
  expected_output: >
    The path to insights.md exactly as returned by the write_insights tool.
  agent: business_analyst

author_contract:
  description: >
    Write the dataset contract the modelling crew must honour. Step 1: call build_contract_measured
    with clean_csv={out_dir}/clean_data.csv, out_dir={out_dir}, raw_path={raw_path}; it measures every
    column and returns the columns with their dtype, role, unit, nullable, null_count, allowed_values,
    min, max and a pre-filled description. Those measured values are facts: you do not change them and
    you do not restate them from memory. Step 2: call write_contract_human_fields with
    contract_path={out_dir}/dataset_contract.json and three JSON arguments:
    descriptions_json = one clear sentence per column for a newcomer (all 20 columns; improve the
    dictionary text where it is unclear, keep it where it is fine);
    rationales_json = for every column, why the constraint exists and what the modelling crew may assume
    (name the unit for money, distance, time and percentage columns; say what a null means; say that
    protected columns are not features; say the id is not a feature and the target is the label);
    assumptions_json = a list of 5 to 8 dataset-level assumptions written as plain sentences, for example
    that CashbackAmount is in USD and not cents, that the row count and sha256 identify exactly this file,
    that nulls are kept and imputation is the modelling crew's job, and what a duplicate-record removal did.
    If the tool answers with "ERROR: ...", fix the JSON and call it again.
  expected_output: >
    The path to dataset_contract.json exactly as returned by write_contract_human_fields.
  agent: data_steward
