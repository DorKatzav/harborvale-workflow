validate:
  description: >
    Before anything is trained, prove that the file you were handed is the file the contract describes.
    Step 1: call read_crew1_artifact on {contract_json} and read it. It is the only description of the
    data you get; there is no upstream system for you to consult and no other file you may open.
    Step 2: call validate_against_contract with clean_csv={clean_csv} and contract_json={contract_json}.
    Read the report. If "passed" is false, do not continue and do not ask for the data another way:
    say which checks failed, quote their messages and hints, and state that training must not start.
    Every number you report must appear in the tool JSON.
  expected_output: >
    A line "HANDOFF: PASS" or "HANDOFF: FAIL", the number of checks run, and for a failure the name,
    message and hint of every failed check, copied from the validate_against_contract JSON.
  agent: feature_engineer

engineer_features:
  description: >
    Only if the previous task reported HANDOFF: PASS. Call engineer_features with clean_csv={clean_csv},
    contract_json={contract_json} and out_dir={out_dir}. The tool decides which columns become inputs
    from the contract itself and adds the engineered ones; you do not choose them and you do not add
    your own. Report the row and column counts and the sha256 exactly as the tool returned them, and
    state in one sentence why the identifier, the label and the protected attributes are not inputs.
  expected_output: >
    A line "FEATURES: <path>" with the features_csv from the tool, its rows and columns counts and its
    sha256, then one sentence on the excluded columns.
  agent: feature_engineer

train_compare:
  description: >
    Call train_and_evaluate with features_csv={out_dir}/features.csv, contract_json={contract_json} and
    out_dir={out_dir}. It cross-validates every variant, writes metrics.json and model.joblib, and
    returns the metrics. Then compare, using only those numbers: every variant against the baseline on
    ROC-AUC and on precision@top10, and say which variant is served and by how much it wins. If a
    variant does not beat the baseline on both, say so plainly rather than working around it.
  expected_output: >
    A short comparison, one line per variant with its ROC-AUC (mean and std) and precision@top10 taken
    from the tool JSON, the baseline line first, and a final line "SERVED: <variant>" with the margin
    over the baseline on both metrics.
  agent: ml_engineer

evaluation_report:
  description: >
    Call write_evaluation_report with out_dir={out_dir} and narrative_json = a JSON object whose keys
    are your headings and whose values are Markdown prose. The comparison table and the importance
    table are generated from metrics.json by the tool, so do not write tables of your own and do not
    restate the numbers from memory. Write one heading, "Reading", of 3 to 5 sentences: which variant
    is served and on what evidence, how it stands against the baseline on the metric that matches the
    decision (a ranked call list), what the top features suggest, and one thing the comparison does
    not settle.
  expected_output: >
    The path to evaluation_report.md exactly as returned by write_evaluation_report.
  agent: model_governance_officer

model_card:
  description: >
    Call write_model_card with out_dir={out_dir} and sections_json = a JSON object with exactly these
    five keys, each non-empty Markdown: "Purpose" (what the score is used for, and that it is a
    priority list rather than a verdict about a person), "Training data" (that Crew 2 saw only the
    contract and the clean file, which column groups became inputs, and which columns are excluded and
    why), "Metrics" (the served variant against the baseline, from the previous task's numbers),
    "Limitations" (what this measurement does not cover - no time-based split, imputed nulls,
    importance is not causation), "Ethical considerations" (protected attributes excluded from the
    inputs but still measured for fairness, what the per-group recall shows, and how the score must
    not be used). The facts tables under "Training data" and "Metrics" are generated by the tool.
    If the tool answers with "ERROR: ...", add the missing section and call it again.
  expected_output: >
    The path to model_card.md exactly as returned by write_model_card.
  agent: model_governance_officer
